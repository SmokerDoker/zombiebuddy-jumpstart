// Add testjar JAR as test dependency
dependencies {
    testImplementation files(tasks.named('testJar'))
    testVanillaImplementation files(tasks.named('testJar'))
    testPatchedImplementation files(tasks.named('testJar'))
    
    // Test dependencies for vanilla and patched tests
    testVanillaImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testVanillaRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'

    testPatchedImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testPatchedRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'

    // required for running tests because many ZB classes reference PZ classes, even if not directly tested, e.g. Exposer
    testPatchedRuntimeOnly files(GAME_CLASSPATH)

    // Jumpstart fork: hotswap test
    testHotswapImplementation files(tasks.named('testJar'))
    testHotswapImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testHotswapRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    testHotswapRuntimeOnly files(GAME_CLASSPATH)

    // Jumpstart fork: trip wire without hotswap
    testGuardImplementation files(tasks.named('testJar'))
    testGuardImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testGuardRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    testGuardRuntimeOnly files(GAME_CLASSPATH)
}

// Configure all test tasks to always run and output test results
tasks.withType(Test) {
    // Always run tests, even if build is up-to-date
    outputs.upToDateWhen { false }

    jvmArgs += "-XX:+EnableDynamicAgentLoading"
    jvmArgs += "-Dzb.filter_stacktrace=true"
    systemProperty 'zb.verbosity', project.findProperty('zb.verbosity')
    
    // Don't capture stdout/stderr - show it directly in console
    testLogging {
        showStandardStreams = project.hasProperty('showStreams')
    }
    
    // Output test results summary
    addTestListener(new TestListener() {
        void beforeSuite(TestDescriptor d) {}
        void afterSuite(TestDescriptor desc, TestResult result) {
            if (!desc.parent) {
                println "\n[=] ${name.padRight(12)}: ${result.testCount} tests, ${result.successfulTestCount} successful, ${result.failedTestCount} failed"
            }
        }
        void beforeTest(TestDescriptor d) {}
        void afterTest(TestDescriptor d, TestResult r) {}
    })
}

// Vanilla tests - run without javaagent
// Run with: gradle test_vanilla
task test_vanilla(type: Test) {
    description = 'Runs vanilla tests (without javaagent) from test_vanilla directory'
    group = 'verification'
    
    useJUnitPlatform()
    dependsOn testJar
    
    // Use testVanilla source set
    testClassesDirs = sourceSets.testVanilla.output.classesDirs
    classpath = sourceSets.testVanilla.runtimeClasspath
}

// Patched tests - run with javaagent
// Run with: gradle test_patched
task test_patched(type: Test) {
    description = 'Runs patched tests (with javaagent) from test_patched directory'
    group = 'verification'
    
    useJUnitPlatform()
    dependsOn testJar
    dependsOn testpatchesJar
    dependsOn shadowJar  // Fat shaded ZombieBuddy.jar (javaagent)

    // Use testPatched source set
    testClassesDirs = sourceSets.testPatched.output.classesDirs
    classpath = sourceSets.testPatched.runtimeClasspath

    // Add javaagent JVM argument with patches_jar parameter
    // Format: <path>:<package_name>
    def patchesJarPath = testpatchesJar.archiveFile.get().asFile.absolutePath
    def patchesPackageName = "me.zed_0xff.zombie_buddy.testpatches"

    // Gson must be on the bootstrap classpath so it is visible when premain() runs.
    // Deferred to doFirst so the configuration is fully resolved before we iterate.
    doFirst {
        def gsonJar = configurations.runtimeClasspath.find { it.name.contains("gson") }
        if (!gsonJar) throw new GradleException("gson jar not found in runtimeClasspath")
        jvmArgs "-Xbootclasspath/a:${gsonJar}"
        jvmArgs "-javaagent:${shadowJar.archiveFile.get().asFile.absolutePath}=patches_jar=${patchesJarPath}:${patchesPackageName},config_dir=.config,prop_prefix=zb"
    }
}

// Jumpstart fork: hotswap tests - run with javaagent, hotswap=true and an Advice-only patches jar
// Run with: gradle test_hotswap
task test_hotswap(type: Test) {
    description = 'Runs the hotswap tests (with javaagent and hotswap=true) from test_hotswap directory'
    group = 'verification'

    useJUnitPlatform()
    dependsOn testJar
    dependsOn hotswappatchesJar
    dependsOn hotswapliveJar
    dependsOn hotswapupdateV1Jar
    dependsOn hotswapupdateV2Jar
    dependsOn hotswapcrashJar
    dependsOn hotswapcrashliveJar
    dependsOn hotswapmainfailJar
    dependsOn hotswapjournalJar
    dependsOn shadowJar

    testClassesDirs = sourceSets.testHotswap.output.classesDirs
    classpath = sourceSets.testHotswap.runtimeClasspath

    def patchesJarPath = hotswappatchesJar.archiveFile.get().asFile.absolutePath
    def patchesPackageName = "me.zed_0xff.zombie_buddy.hotswappatches"
    def crashJarPath = hotswapcrashJar.archiveFile.get().asFile.absolutePath
    systemProperty 'zb.test.hotswapCrashJar', crashJarPath
    systemProperty 'zb.test.hotswapCrashLiveJar', hotswapcrashliveJar.archiveFile.get().asFile.absolutePath
    systemProperty 'zb.test.hotswapMainFailJar', hotswapmainfailJar.archiveFile.get().asFile.absolutePath
    systemProperty 'zb.test.hotswapJournalJar', hotswapjournalJar.archiveFile.get().asFile.absolutePath
    systemProperty 'zb.test.journalFile', layout.buildDirectory.file("hotswap-journal-written.txt").get().asFile.absolutePath
    systemProperty 'zb.test.hotswapJar', patchesJarPath
    systemProperty 'zb.test.hotswapLiveJar', hotswapliveJar.archiveFile.get().asFile.absolutePath
    systemProperty 'zb.test.hotswapUpdateV1Jar', hotswapupdateV1Jar.archiveFile.get().asFile.absolutePath
    systemProperty 'zb.test.hotswapUpdateV2Jar', hotswapupdateV2Jar.archiveFile.get().asFile.absolutePath
    // Own config dir: the live-load test writes mod_approvals.json there.
    def hotswapConfigDir = layout.buildDirectory.dir("hotswap-config").get().asFile.absolutePath

    doFirst {
        def gsonJar = configurations.runtimeClasspath.find { it.name.contains("gson") }
        if (!gsonJar) throw new GradleException("gson jar not found in runtimeClasspath")
        jvmArgs "-Xbootclasspath/a:${gsonJar}"
        jvmArgs "-javaagent:${shadowJar.archiveFile.get().asFile.absolutePath}=patches_jar=${patchesJarPath}:${patchesPackageName};${crashJarPath}:me.zed_0xff.zombie_buddy.hotswapcrash,config_dir=${hotswapConfigDir},prop_prefix=zb,hotswap=true"
    }
}

// Jumpstart fork: the crash protection's trip wire without hotswap (patches cannot be removed)
// Run with: gradle test_guard
task test_guard(type: Test) {
    description = 'Runs the crash-protection test without hotswap (trip wire) from test_guard directory'
    group = 'verification'

    useJUnitPlatform()
    dependsOn testJar
    dependsOn hotswapcrashJar
    dependsOn shadowJar

    testClassesDirs = sourceSets.testGuard.output.classesDirs
    classpath = sourceSets.testGuard.runtimeClasspath

    def crashJarPath = hotswapcrashJar.archiveFile.get().asFile.absolutePath
    systemProperty 'zb.test.hotswapCrashJar', crashJarPath
    def guardConfigDir = layout.buildDirectory.dir("guard-config").get().asFile.absolutePath

    doFirst {
        def gsonJar = configurations.runtimeClasspath.find { it.name.contains("gson") }
        if (!gsonJar) throw new GradleException("gson jar not found in runtimeClasspath")
        jvmArgs "-Xbootclasspath/a:${gsonJar}"
        jvmArgs "-javaagent:${shadowJar.archiveFile.get().asFile.absolutePath}=patches_jar=${crashJarPath}:me.zed_0xff.zombie_buddy.hotswapcrash,config_dir=${guardConfigDir},prop_prefix=zb,guard=switch,guard_limit=1"
    }
}

// Unit tests (test/ source set) - e.g. AccessorTest, VersionCheckTest, PatchTest
task unitTest(type: Test) {
    description = 'Runs unit tests from test/ directory'
    group = 'verification'

    useJUnitPlatform()
    dependsOn testJar
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath + files(GAME_CLASSPATH)
}

// Main test task - runs unit tests, vanilla, and patched tests
// Run with: gradle test
tasks.named('test', Test) {
    description = 'Runs unit, vanilla, and patched tests'
    group = 'verification'
    
    // Don't discover tests from the default test source set
    testClassesDirs = files()
    classpath = files()
    
    dependsOn unitTest
    dependsOn test_vanilla
    dependsOn test_patched
    dependsOn test_hotswap
    dependsOn test_guard
    
    // Don't fail if no tests are discovered (since we're not running any here)
    failOnNoDiscoveredTests = false
    
    // Force the task to always execute by making it produce output
    outputs.file("${buildDir}/.test-completed")
    
    doLast {
        // Create a marker file to indicate tests completed
        file("${buildDir}/.test-completed").createNewFile()
    }
}

// Signs ../authors.json in-place.
// Canonical form: file bytes with the "signature" hex value replaced by "".
// Signed payload: "ZBAuthors:" + sha256hex(canonical_bytes).
// Private key: -PzbsPrivateKeyFile=<path-to-ed25519-private.der>
task signAuthorsJson {
    description = 'Sign ../authors.json in-place with Ed25519'
    group = 'signing'

    def authorsFile = file('../authors.json')
    inputs.file(authorsFile)
    outputs.file(authorsFile)
    outputs.upToDateWhen { false }

    doLast {
        def keyPath = project.findProperty('zbsPrivateKeyFile')?.toString()?.trim()
        if (!keyPath) {
            throw new GradleException('signAuthorsJson: no zbsPrivateKeyFile')
        }
        def keyFile = file(keyPath)
        if (!keyFile.isFile()) {
            throw new GradleException("signAuthorsJson: key file not found: ${keyFile}")
        }

        def content = authorsFile.getText('UTF-8')
        def sigPattern = ~/(?s)("signature"\s*:\s*")([0-9a-fA-F]*)(")/

        if (!sigPattern.matcher(content).find()) {
            throw new GradleException('signAuthorsJson: no "signature" field found in authors.json')
        }

        // Canonical: same bytes but signature value cleared to ""
        def canonical = content.replaceFirst(sigPattern, '$1$3')
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def canonicalBytes = canonical.getBytes('UTF-8')
        digest.update(canonicalBytes)
        def sha256Hex = digest.digest().collect { String.format('%02x', it & 0xff) }.join('')

        def msgBytes = "ZBAuthors:${sha256Hex}".getBytes('UTF-8')

        def pkcs8 = keyFile.bytes
        try {
            def pkInfo = org.bouncycastle.asn1.pkcs.PrivateKeyInfo.getInstance(pkcs8)
            def asym  = org.bouncycastle.crypto.util.PrivateKeyFactory.createKey(pkInfo)
            def priv  = (org.bouncycastle.crypto.params.Ed25519PrivateKeyParameters) asym
            def pubHex = priv.generatePublicKey().getEncoded().collect { String.format('%02x', it & 0xff) }.join('')

            def signer = new org.bouncycastle.crypto.signers.Ed25519Signer()
            signer.init(true, priv)
            signer.update(msgBytes, 0, msgBytes.length)
            def sigHex = signer.generateSignature().collect { String.format('%02x', it & 0xff) }.join('')

            def signed = content.replaceFirst(sigPattern, "\$1${sigHex}\$3")
            authorsFile.setText(signed, 'UTF-8')
            logger.lifecycle("authors.json signed (pubkey: ${pubHex})")
        } finally {
            Arrays.fill(pkcs8, (byte) 0)
        }
    }
}
