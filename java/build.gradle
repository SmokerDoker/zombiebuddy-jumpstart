plugins {
    id 'java'
    id 'signing'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'io.github.zed-0xff.zb-gradle-plugin' version '1.0.3'
}

def DEFAULT_JVM = 25
layout.buildDirectory = layout.projectDirectory.dir("build/jdk${project.findProperty('javaVersion') ?: DEFAULT_JVM}")

// Game classpath: comma-separated JARs or dirs. Set via -PgameClasspath=... and/or env PZ_CLASSPATH.
// Optional: only needed for compilation, not for running tests
def rawGameClasspath = project.findProperty('gameClasspath')?.toString()?.trim()
if (!rawGameClasspath) {
    rawGameClasspath = System.getenv('PZ_CLASSPATH')?.trim()
}
if (!rawGameClasspath) {
    rawGameClasspath = System.getProperty("pz.classpath")
}
def GAME_CLASSPATH = []
if (rawGameClasspath) {
    GAME_CLASSPATH = rawGameClasspath.split(',').collect { path -> file(path.trim()) }
}

// Read version from VERSION file
def version = file('VERSION').text.trim()

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation 'net.bytebuddy:byte-buddy:1.18.14'
//    implementation 'org.ow2.asm:asm:9.10.1'
    implementation 'org.ow2.asm:asm-tree:9.10.1'                   // XXX should match version.asm in byte-buddy's pom.xml
    implementation 'com.google.code.gson:gson:2.14.0'

    compileOnly files(GAME_CLASSPATH)
    
    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    // Jumpstart fork: ZombieBuddy verifies Ed25519 with the JDK; the tests sign with Bouncy Castle
    testImplementation 'org.bouncycastle:bcprov-jdk18on:1.86'
}

def MOD_ID = project.projectDir.parentFile.name
jar {
    archiveBaseName.set(MOD_ID)
    archiveClassifier.set("plain")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            'Premain-Class': 'me.zed_0xff.zombie_buddy.Agent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true',
            'Implementation-Version': version
        )
    }
}

shadowJar {
    archiveBaseName.set(MOD_ID)
    archiveClassifier.set("")
    manifest {
        attributes(
            'Premain-Class': 'me.zed_0xff.zombie_buddy.Agent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true',
            'Implementation-Version': version
        )
    }

    mergeServiceFiles()

    // ServiceFileTransformer needs to see all copies so it can merge them.
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    relocate 'com.google.gson', 'zb.com.google.gson'

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.MF'
    exclude 'META-INF/versions/**'
    exclude '*.dll'

    // Jumpstart fork: the annotation processor checks patches at compile time (javac), never in the
    // game; compile*Java below gets it from sourceSets.main.output, not from this jar.
    exclude 'me/zed_0xff/zombie_buddy/PatchAnnotationProcessor*.class'
    exclude 'META-INF/services/javax.annotation.processing.Processor'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Configure signing
// Supports:
// 1. KeychainStore - Direct access to Apple Keychain (no export needed)
// 2. PKCS12 (.p12) - Exported from Keychain
// 3. JKS - Traditional Java keystore
//
// To use KeychainStore (recommended on macOS):
//   - Set signing.storeType=KeychainStore
//   - Set signing.keyAlias to your certificate's common name
//   - Find certificate name: security find-identity -p codesigning -v
//   - No storeFile or passwords needed
def osName = System.getProperty("os.name").toLowerCase()
def useKeychain = osName.contains("mac") && project.findProperty('signing.storeType') == 'KeychainStore'
def hasStoreFile = project.hasProperty('signing.storeFile')

if (useKeychain) {
    // Use KeychainStore - create a custom signing task
    def keyAlias = project.findProperty('signing.keyAlias')
    
    // Create a custom task that uses jarsigner with KeychainStore
    task signJar(type: Exec) {
        dependsOn shadowJar
        onlyIf { keyAlias != null }
        
        def jarFile = shadowJar.archiveFile.get().asFile
        
        // Use jarsigner from PATH or find it from JAVA_HOME
        def jarsignerPath = System.getenv('JAVA_HOME') ? 
            new File(System.getenv('JAVA_HOME'), "bin/jarsigner").absolutePath : 
            "jarsigner"
        
        commandLine jarsignerPath,
            '-keystore', 'NONE',
            '-storetype', 'KeychainStore',
            '-storepass', '',
            '-keypass', '',
            jarFile.absolutePath,
            keyAlias
    }
    
    // Make the build depend on signing
    build.dependsOn signJar
} else if (hasStoreFile) {
    // Use file-based keystore (JKS or PKCS12)
    signing {
        required = true
        
        def storeFilePath = project.findProperty('signing.storeFile')
        def storeFileObj = file(storeFilePath)
        def storeType = project.findProperty('signing.storeType')
        
        // Auto-detect keystore type if not specified
        if (storeType == null) {
            def fileName = storeFileObj.name.toLowerCase()
            if (fileName.endsWith('.p12') || fileName.endsWith('.pfx')) {
                storeType = 'PKCS12'
            } else if (fileName.endsWith('.jks')) {
                storeType = 'JKS'
            }
        }
        
        storeFile = storeFileObj
        storePassword = project.findProperty('signing.storePassword')
        keyAlias = project.findProperty('signing.keyAlias')
        keyPassword = project.findProperty('signing.keyPassword')
        
        sign shadowJar
    }
}

java {
  toolchain {
    // makes java version a part of cache key for all compile tasks
    languageVersion = JavaLanguageVersion.of((project.findProperty('javaVersion') ?: DEFAULT_JVM).toInteger())
  }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
            include '**/*.java'
            exclude 'me/zed_0xff/zombie_buddy/patches/**'
        }
    }
    patches {
        java {
            srcDirs = ['src/main/java/me/zed_0xff/zombie_buddy/patches']
            include '**/*.java'
            exclude 'experimental/**'
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    experimental {
        java {
            srcDirs = ['src/main/java/me/zed_0xff/zombie_buddy/patches/experimental']
            include '**/*.java'
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + patches.output
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + patches.output
    }
    test {
        java {
            srcDirs = ['test']
            include '**/*.java'
        }
        // Ensure test source set can access main source set classes
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
    testVanilla {
        java {
            srcDirs = ['test_vanilla']
            include '**/*.java'
        }
        // Ensure testVanilla source set can access main source set classes
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
    testPatched {
        java {
            srcDirs = ['test_patched']
            include '**/*.java'
        }
        // Ensure testPatched source set can access main source set classes
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
    testjar {
        java {
            srcDirs = ['testjar/src']
            include '**/*.java'
        }
        // testjar needs access to main classes for @Patch annotation
        compileClasspath += main.output
    }
    testpatches {
        java {
            srcDirs = ['testpatches']
            include '**/*.java'
        }
        // testpatches needs access to main classes for @Patch annotation
        compileClasspath += main.output
        // testpatches needs access to testjar classes for CustomObject
        compileClasspath += testjar.output
    }
    // Jumpstart fork: Advice-only patches for test_hotswap
    hotswappatches {
        java {
            srcDirs = ['hotswappatches']
            include '**/*.java'
        }
        compileClasspath += main.output
    }
    hotswaplive {
        java {
            srcDirs = ['hotswaplive']
            include '**/*.java'
        }
        compileClasspath += main.output
    }
    hotswapupdatev1 {
        java {
            srcDirs = ['hotswapupdate/v1']
            include '**/*.java'
        }
        compileClasspath += main.output
    }
    hotswapupdatev2 {
        java {
            srcDirs = ['hotswapupdate/v2']
            include '**/*.java'
        }
        compileClasspath += main.output
    }
    // Jumpstart fork: crash protection and journal tests (see ModGuard, ModJournal)
    hotswapcrash {
        java {
            srcDirs = ['hotswapcrash']
            include '**/*.java'
        }
        compileClasspath += main.output + testjar.output
    }
    hotswapcrashlive {
        java {
            srcDirs = ['hotswapcrashlive']
            include '**/*.java'
        }
        compileClasspath += main.output
    }
    hotswapmainfail {
        java {
            srcDirs = ['hotswapmainfail']
            include '**/*.java'
        }
        compileClasspath += main.output
    }
    hotswapjournal {
        java {
            srcDirs = ['hotswapjournal']
            include '**/*.java'
        }
        compileClasspath += main.output + testjar.output + files(GAME_CLASSPATH)
    }
    // Jumpstart fork: ZBCrashTest, the in-game test mod for the crash protection (tools/gametest.ps1)
    zbcrashtest {
        java {
            srcDirs = ['zbcrashtest/src']
            include '**/*.java'
        }
        compileClasspath += main.output + files(GAME_CLASSPATH)
    }
    testHotswap {
        java {
            srcDirs = ['test_hotswap']
            include '**/*.java'
        }
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
    testGuard {
        java {
            srcDirs = ['test_guard']
            include '**/*.java'
        }
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

// Copy native DLL to build/libs
task copyNativeDll(type: Copy) {
    description = 'Copies zbNative.dll to build/libs directory'
    group = 'build'
    
    def sourceFile = file('../c/windows/zbNative.dll')
    
    doFirst {
        if (!sourceFile.exists()) {
            throw new RuntimeException("zbNative.dll not found at ${sourceFile.absolutePath}")
        }
        println "[ZB] Copying zbNative.dll from ${sourceFile.absolutePath} to ${buildDir}/libs"
    }
    
    from sourceFile
    into "$buildDir/libs"
    
    // Ensure task always runs
    outputs.upToDateWhen { false }
}

// Gradle 9: signJarZBS and copyNativeDll both touch build/libs — declare ordering.
tasks.whenTaskAdded { task ->
    if (task.name == 'signJarZBS') {
        task.dependsOn(tasks.named('copyNativeDll'))
    }
}

tasks.named("check") {
    dependsOn test
}

tasks.named("build") {
    dependsOn check
    dependsOn shadowJar
    finalizedBy copyNativeDll
}

tasks.named("assemble") {
    dependsOn shadowJar
}

// Ensure copyNativeDll runs after the shaded agent JAR is built
copyNativeDll.mustRunAfter shadowJar

// disable annotation processing, JNI headers, and incremental compilation
tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory.set(provider { null })
    options.headerOutputDirectory.set(provider { null })
    options.incremental = false

    // doLast {
        // delete "${buildDir}/tmp"
    // }
}

// Enable deprecation warnings for main source set only; suppress them in all test/auxiliary sets
tasks.withType(JavaCompile).configureEach {
    if (name == 'compileJava') {
        options.compilerArgs << '-Xlint:deprecation'
    } else {
        options.compilerArgs << '-Xlint:-deprecation' << '-Xlint:-removal'
    }
}

// Enable annotation processor for testpatches (validates patches at compile time).
// Must come after the tasks.withType(JavaCompile) block above to override annotationProcessorPath.
compileTestpatchesJava {
    dependsOn compileJava
    options.annotationProcessorPath = files(sourceSets.main.output)
}

compilePatchesJava {
    dependsOn compileJava
    options.annotationProcessorPath = files(sourceSets.main.output)
}

compileExperimentalJava {
    dependsOn compileJava, compilePatchesJava
    options.annotationProcessorPath = files(sourceSets.main.output)
}

// Helper to recursively check for .class files
def hasClassFiles(File dir) {
    if (!dir.exists() || !dir.isDirectory()) {
        return false
    }
    def files = dir.listFiles()
    if (files == null) {
        return false
    }
    for (def file : files) {
        if (file.isFile() && file.name.endsWith('.class')) {
            return true
        }
        if (file.isDirectory() && hasClassFiles(file)) {
            return true
        }
    }
    return false
}

// Require gameClasspath for main source compilation, unless classes are already compiled
def compileJavaTask = tasks.named('compileJava', JavaCompile).get()
compileJavaTask.onlyIf {
    if (!GAME_CLASSPATH.isEmpty()) {
        return true // Always compile if gameClasspath is provided
    }
    
    // Check if classes already exist - recursively search for .class files
    def outputDir = compileJavaTask.destinationDirectory.get().asFile
    if (hasClassFiles(outputDir)) {
        return false // Skip compilation if classes exist
    }
    
    // No classes found - will fail in doFirst
    return true
}

compileJavaTask.doFirst {
    if (GAME_CLASSPATH.isEmpty()) {
        // Verify classes exist (in case onlyIf didn't work)
        def outputDir = destinationDirectory.get().asFile
        if (!hasClassFiles(outputDir)) {
            throw new RuntimeException(
                "Game classpath must be set: -PgameClasspath=<path1>,<path2>,... and/or env PZ_CLASSPATH " +
                "(comma-separated JARs or directories).\n" +
                "Example: gradle build -PgameClasspath=../../../../../42.13/java/projectzomboid.jar\n" +
                "Note: Tests can run without game classpath if classes are already compiled."
            )
        }
    }
}

// Create JAR for testjar source set (only TargetClass, no patches)
task testJar(type: Jar) {
    archiveBaseName.set("testjar")
    from sourceSets.testjar.output
    // Exclude patch classes - only include TargetClass
    exclude 'testjar/TargetPatch.class'
    dependsOn compileTestjarJava
}

// Relocate gson refs at jar build time (matches shadowJar); runtime pipeline must not rewrite again.
task patchesJar(type: com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveBaseName.set("patches")
    configurations = []
    from sourceSets.patches.output
    dependsOn compilePatchesJava
    relocate 'com.google.gson', 'zb.com.google.gson'
}

task experimentalJar(type: com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveBaseName.set("experimental")
    configurations = []
    from sourceSets.experimental.output
    dependsOn compileExperimentalJava
    relocate 'com.google.gson', 'zb.com.google.gson'
}

shadowJar {
    dependsOn patchesJar
    from(patchesJar.archiveFile) {
        rename { 'patches.jar' }
    }
}

// Jumpstart fork: experimental.jar (agent option `experimental`: Lua server, debug patches) is not
// in the player jar. The automated in-game tests need its Lua server; they use this jar instead:
// build/jdk25/libs/zombiebuddy-jumpstart-experimental.jar = the player jar + experimental.jar.
task shadowJarExperimental(type: Zip) {
    description = 'Builds the agent jar with experimental.jar, for the automated in-game tests'
    group = 'build'
    dependsOn shadowJar, experimentalJar
    archiveBaseName.set(MOD_ID)
    archiveClassifier.set('experimental')
    archiveExtension.set('jar')
    destinationDirectory.set(shadowJar.destinationDirectory)
    from(zipTree(shadowJar.archiveFile))
    from(experimentalJar.archiveFile) {
        rename { 'experimental.jar' }
    }
}

tasks.named("build") {
    dependsOn patchesJar
    dependsOn experimentalJar
}

// Create JAR for testpatches source set (contains patch classes)
task testpatchesJar(type: Jar) {
    archiveBaseName.set("testpatches")
    from sourceSets.testpatches.output
    dependsOn compileTestpatchesJava
}

