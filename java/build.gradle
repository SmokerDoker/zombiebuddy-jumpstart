task zbCrashTestMod(type: Sync) {
    description = 'Builds the ZBCrashTest mod folder for tools/gametest.ps1'
    group = 'build'
    into layout.buildDirectory.dir("testmods/ZBCrashTest")
    from('zbcrashtest/mod')
    from(zbCrashTestJar) {
        into '42/media/java/client'
    }
