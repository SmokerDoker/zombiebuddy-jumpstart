// Jumpstart fork: the ZBCrashTest mod folder for the in-game test (build/jdk25/testmods/ZBCrashTest)
task zbCrashTestJar(type: Jar) {
    archiveFileName.set("ZBCrashTest.jar")
    destinationDirectory.set(layout.buildDirectory.dir("zbcrashtest"))
    from sourceSets.zbcrashtest.output
    dependsOn compileZbcrashtestJava
